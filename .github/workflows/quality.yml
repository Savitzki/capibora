name: Qualidade e segurança

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Contratos das Edge Functions com serviços locais fictícios
        run: >-
          deno test --frozen --allow-env --allow-net=127.0.0.1
          --node-modules-dir=none --lock=deno.lock
          supabase/functions/login-with-nickname/index.test.ts
          supabase/functions/group-notify/core.test.ts
          supabase/functions/push-dispatch/core.test.ts
          supabase/functions/delete-account/core.test.ts
          supabase/functions/delete-account/service.test.ts
