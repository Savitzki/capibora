project_id = "fokus-trainer"

[functions.delete-account]
# The handler validates the captured bearer token with Auth before any admin call.
verify_jwt = false

[functions.push-dispatch]
# Private cron endpoint: authentication is checked with x-cron-secret in the handler.
verify_jwt = false

[functions.group-notify]
# The handler validates the bearer token with Supabase Auth before using any RPC.
verify_jwt = false

[functions.login-with-nickname]
# Public login: GoTrue validates the password; the email resolver is service-role only.
verify_jwt = false
